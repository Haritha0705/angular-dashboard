<div class="page-header">
  <h1>Settings</h1>
  <p>Manage your profile and preferences.</p>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
  <!-- Profile Card -->
  <div class="lg:col-span-1">
    <p-card header="Profile">
      <div class="flex flex-col items-center gap-4">
        <p-avatar label="H" size="xlarge" shape="circle" styleClass="avatar-primary text-2xl w-20 h-20" />
        <div class="text-center">
          <div class="font-semibold text-lg text-heading">{{ profile.name }}</div>
          <div class="text-sm text-muted">{{ profile.email }}</div>
        </div>
        <p-button label="Edit Profile" icon="pi pi-pencil" [outlined]="true" size="small" />
      </div>
    </p-card>
  </div>

  <!-- Details & Preferences -->
  <div class="lg:col-span-2 flex flex-col gap-6">
    <p-card header="Account Details">
      <div class="flex flex-col gap-4">
        <div>
          <label class="block text-sm font-medium mb-1" style="color: var(--color-text-secondary);">Full Name</label>
          <input pInputText [(ngModel)]="profile.name" class="w-full" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1" style="color: var(--color-text-secondary);">Email</label>
          <input pInputText [(ngModel)]="profile.email" class="w-full" />
        </div>
        <div class="flex justify-end">
          <p-button label="Save Changes" icon="pi pi-check" size="small" />
        </div>
      </div>
    </p-card>

    <p-card header="Preferences">
      @for (pref of preferences; track pref.key; let last = $last) {
        <div class="flex justify-between items-center py-3">
          <div>
            <div class="font-medium text-heading">{{ pref.label }}</div>
          </div>
          <p-toggleSwitch [(ngModel)]="pref.enabled" />
        </div>
        @if (!last) { <p-divider /> }
      }
    </p-card>
  </div>
</div>
