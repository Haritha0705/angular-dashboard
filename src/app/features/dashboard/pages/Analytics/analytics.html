<div class="space-y-6">
      <div>
        <h1 class="text-2xl font-semibold text-slate-800">Analytics</h1>
        <p class="text-sm text-slate-500">Last 30 days</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        @for (k of kpis; track k.label) {
          <div class="bg-white rounded-lg border border-slate-200 p-4">
            <div class="text-sm text-slate-500">{{ k.label }}</div>
            <div class="mt-2 text-2xl font-semibold text-slate-800">{{ k.value }}</div>
            <div
              class="mt-1 text-xs"
              [class.text-emerald-600]="k.tone === 'up'"
              [class.text-rose-600]="k.tone === 'down'"
            >
              {{ k.delta }}
            </div>
          </div>
        }
      </div>

      <div class="bg-white rounded-lg border border-slate-200 p-4">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">Traffic</h2>
        <div class="flex items-end gap-2 h-40">
          @for (b of bars; track $index) {
            <div
              class="flex-1 bg-blue-500/80 hover:bg-blue-600 rounded-t transition"
              [style.height.%]="b"
            ></div>
          }
        </div>
      </div>
</div>
