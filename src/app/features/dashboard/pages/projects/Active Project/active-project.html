@if (loading()) {
      <div class="text-slate-500">Loading projects...</div>
    } @else if (error()) {
      <div class="text-red-500">{{ error() }}</div>
    } @else {
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        @for (p of projects(); track p.name) {
          <div
            class="bg-white rounded-lg border border-slate-200 p-4 space-y-3 shadow-sm hover:shadow-md transition"
          >
            <!-- Header -->
            <div class="flex items-start justify-between">
              <div>
                <div class="text-sm font-semibold text-slate-800">
                  {{ p.name }}
                </div>
                <div class="text-xs text-slate-500">Owner: {{ p.owner }}</div>
              </div>

              <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">
                Active
              </span>
            </div>

            <!-- Progress -->
            <div>
              <div class="flex items-center justify-between text-xs text-slate-500 mb-1">
                <span>Progress</span>
                <span>{{ p.progress }}%</span>
              </div>

              <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
                <div
                  class="h-full bg-blue-600 transition-all duration-300"
                  [style.width.%]="p.progress"
                ></div>
              </div>
            </div>

            <!-- Footer -->
            <div class="text-xs text-slate-500">Due {{ p.due }}</div>
          </div>
        }
      </div>
    }
