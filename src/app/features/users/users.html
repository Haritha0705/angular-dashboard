<div class="page-header">
  <h1>Users</h1>
  <p>{{ store.users().length }} team members.</p>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
  @if (store.loading()) {
    @for (i of [1,2,3,4,5,6,7,8]; track i) {
      <p-card>
        <div class="flex flex-col items-center text-center gap-3">
          <p-skeleton shape="circle" size="4rem" />
          <div class="w-full flex flex-col items-center">
            <p-skeleton width="60%" height="1.5rem" styleClass="mb-2" />
            <p-skeleton width="40%" height="1rem" />
          </div>
          <p-skeleton width="4rem" height="1.5rem" styleClass="mt-2" />
          <p-divider styleClass="w-full" />
          <div class="flex gap-2 justify-center w-full">
            <p-skeleton shape="circle" size="2rem" />
            <p-skeleton shape="circle" size="2rem" />
            <p-skeleton shape="circle" size="2rem" />
          </div>
        </div>
      </p-card>
    }
  } @else {
    @for (user of store.users(); track user.id) {
      <p-card>
        <div class="flex flex-col items-center text-center gap-3">
          <p-avatar [label]="user.initials" size="xlarge" shape="circle" styleClass="avatar-primary-soft" />
          <div>
            <div class="font-semibold text-heading">{{ user.name }}</div>
            <div class="text-xs text-muted mt-1">{{ user.role }}</div>
          </div>
          <p-tag [value]="user.status" [severity]="getStatusSeverity(user.status)" [rounded]="true" />
          <p-divider />
          <div class="flex gap-2">
            <p-button icon="pi pi-envelope" [rounded]="true" [text]="true" severity="secondary" size="small" />
            <p-button icon="pi pi-phone" [rounded]="true" [text]="true" severity="secondary" size="small" />
            <p-button icon="pi pi-ellipsis-v" [rounded]="true" [text]="true" severity="secondary" size="small" />
          </div>
        </div>
      </p-card>
    }
  }
</div>
